[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bloks"
version = "0.1.0"
description = "Sketched block-Jacobi preconditioned CG for Nyström kernel ridge regression"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["jax"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
